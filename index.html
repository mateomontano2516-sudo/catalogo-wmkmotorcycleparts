<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071a49">
<title>WMK MOTORCYCLEPARTS | Catálogo</title>
<style>
:root{--navy:#071A49;--blue:#123DA8;--sky:#DCE8FA;--gray:#E6E7EA;--paper:#F4F4F5;--white:#fff;--ink:#101b35;--muted:#586477;--line:#d5d9e1}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--gray);color:var(--ink)}
header{background:var(--navy);color:var(--white);padding:28px 24px 32px;border-bottom:6px solid var(--blue)}
.header-inner{max-width:1320px;margin:auto}.top{display:flex;align-items:center;gap:30px}.logo-frame{width:190px;height:145px;flex:0 0 190px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:15px;padding:10px;box-shadow:0 5px 18px #0002}.logo{width:100%;height:100%;object-fit:contain}.brand h1{font-size:clamp(26px,3.1vw,39px);letter-spacing:1.6px;line-height:1.08;margin:0 0 10px;font-weight:900}.brand p{margin:0;color:#dce8fa;font-size:16px;letter-spacing:3px;font-weight:700}
.hero{margin:26px 0 0;padding:20px 0 0;border-top:1px solid #ffffff35;display:flex;align-items:end;justify-content:space-between;gap:24px}.hero-copy{max-width:760px}.hero h2{font-size:clamp(28px,3.5vw,43px);line-height:1.08;margin:0 0 10px;font-weight:900;letter-spacing:-.6px}.hero p{font-size:19px;line-height:1.5;color:#e0e8f8;margin:0;max-width:760px}
.brand-strip{background:#fff;border-bottom:1px solid #cfd4dd;padding:18px 24px}.brands{max-width:1320px;margin:auto;display:flex;align-items:center;justify-content:space-around;gap:18px;flex-wrap:wrap}.brand-word{font-weight:900;color:var(--navy);font-size:clamp(19px,2.2vw,27px);letter-spacing:1px;white-space:nowrap}.brand-word.bajaj{font-style:italic;letter-spacing:2px}.brand-word.yamaha{font-weight:900;letter-spacing:2px}.brand-word.tvs{font-style:italic;letter-spacing:3px}.brand-word.hero{display:inline-block;margin:0;padding:0;border:0;font-size:clamp(19px,2.2vw,27px);font-weight:900;letter-spacing:1px}.brand-word.suzuki{letter-spacing:1px}.brand-word.victory{letter-spacing:2px}
.wrap{max-width:1320px;margin:0 auto;padding:30px 24px 44px}.tools{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}.search{width:100%;padding:18px 20px;border:1px solid #c9ced7;border-radius:12px;font-size:18px;background:#fff;color:var(--ink);box-shadow:0 2px 7px #071a490d}.search:focus{outline:3px solid #123da833;border-color:var(--blue)}.tabs{display:flex;gap:10px;overflow:auto;padding:2px 0 16px}.tab{white-space:nowrap;border:1px solid #cbd1db;background:#fff;padding:13px 19px;border-radius:30px;cursor:pointer;color:var(--navy);font-size:15px;font-weight:800;letter-spacing:.3px}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.count{color:#47536a;font-size:15px;font-weight:700;margin:4px 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:19px}.card{background:#fff;border:1px solid #d4d8df;border-radius:15px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 3px 10px #071a4909;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-3px);box-shadow:0 9px 22px #071a4918}.photo{height:175px;background:linear-gradient(135deg,#e9edf3,#d9dfe8);display:flex;align-items:center;justify-content:center;color:#52627b;font-size:14px;text-align:center;padding:15px}.photo span{border:1px dashed #8d9bb1;border-radius:10px;padding:18px 22px;background:#ffffff66}.info{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}.cat{font-size:12px;color:var(--blue);font-weight:900;letter-spacing:1.2px}.name{font-size:19px;font-weight:800;line-height:1.32;color:#111b31}.code,.app{font-size:15px;line-height:1.4;color:#536078}.price{font-size:25px;font-weight:900;color:var(--navy);margin-top:auto;padding-top:12px}.footer{padding:28px 20px;text-align:center;background:var(--navy);color:#dce8fa;font-size:14px;letter-spacing:.4px}.empty{background:#fff;border:1px dashed #aab3c2;padding:40px;text-align:center;border-radius:12px;color:var(--muted);font-size:17px}
@media(max-width:650px){header{padding:18px 17px 25px}.top{gap:15px;align-items:center}.logo-frame{width:112px;height:92px;flex-basis:112px;padding:6px}.brand h1{font-size:19px;letter-spacing:.5px}.brand p{font-size:10px;letter-spacing:1.5px}.hero{margin-top:20px;padding-top:18px}.hero h2{font-size:29px}.hero p{font-size:16px}.brand-strip{padding:14px 12px}.brands{gap:12px 20px}.brand-word,.brand-word.hero{font-size:18px}.wrap{padding:22px 14px 34px}.search{font-size:16px;padding:15px}.tab{font-size:13px;padding:11px 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{height:120px;font-size:12px}.photo span{padding:12px 10px}.info{padding:12px;gap:8px}.name{font-size:16px}.code,.app{font-size:13px}.price{font-size:20px}}
@media(max-width:380px){.logo-frame{width:92px;height:80px;flex-basis:92px}.brand h1{font-size:16px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="header-inner">
  <div class="top"><div class="logo-frame"><img class="logo" src="assets/logo-wmk.png" alt="Logotipo WMK MOTORCYCLEPARTS"></div><div class="brand"><h1>WMK MOTORCYCLEPARTS</h1><p>REPUESTOS PARA TU MOTO</p></div></div>
  <section class="hero"><div class="hero-copy"><h2>Todo para tu moto, en un solo lugar.</h2><p>Explora nuestro catálogo de repuestos. Encuentra referencias y aplicaciones para tu motocicleta.</p></div></section>
</div></header>
<div class="brand-strip" aria-label="Marcas de motocicletas"><div class="brands"><span class="brand-word bajaj">BAJAJ</span><span class="brand-word yamaha">YAMAHA</span><span class="brand-word tvs">TVS</span><span class="brand-word hero">HERO</span><span class="brand-word suzuki">SUZUKI</span><span class="brand-word victory">VICTORY</span></div></div>
<main class="wrap"><div class="tools"><input id="search" class="search" placeholder="Buscar producto, código o modelo..."></div><nav class="tabs" id="tabs"></nav><div class="count" id="count"></div><section class="grid" id="grid"></section></main>
<footer class="footer">WMK MOTORCYCLEPARTS · REPUESTOS PARA TU MOTO</footer>
<script>
let products=[];let active='TODOS LOS PRODUCTOS';const cats=['TODOS LOS PRODUCTOS','PLÁSTICOS','REPUESTOS','LLANTAS','ORIGINALES'];
fetch('products.json').then(r=>{if(!r.ok)throw new Error('No se pudo cargar el catálogo');return r.json()}).then(d=>{products=d;renderTabs();render()}).catch(()=>{document.getElementById('count').textContent='No se pudo cargar la lista de productos. Recarga la página.'});
function renderTabs(){document.getElementById('tabs').innerHTML=cats.map(c=>`<button class="tab ${c===active?'active':''}" onclick="choose('${c}')">${c}</button>`).join('')}
function choose(c){active=c;renderTabs();render()}
function money(n){return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n)}
function render(){let q=document.getElementById('search').value.toLowerCase();let list=products.filter(p=>(active==='TODOS LOS PRODUCTOS'||p.category===active)&&[p.name,p.code,p.application].join(' ').toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'es'));document.getElementById('count').textContent=`${list.length} productos`;document.getElementById('grid').innerHTML=list.length?list.map(p=>`<article class="card"><div class="photo"><span>Fotografía del producto<br>pendiente de cargar</span></div><div class="info"><div class="cat">${p.category}</div><div class="name">${p.name}</div><div class="code">Código: ${p.code}</div>${p.application?`<div class="app">Aplicación: ${p.application}</div>`:''}<div class="price">${money(p.price)}</div></div></article>`).join(''):'<div class="empty">No encontramos productos con esa búsqueda.</div>'}
document.getElementById('search').addEventListener('input',render);
</script>
</body></html>
