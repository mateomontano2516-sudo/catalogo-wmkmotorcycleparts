<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WMK MOTORCYCLEPARTS | Catálogo</title><style>
:root{--navy:#071A49;--blue:#123DA8;--ink:#18233d;--muted:#68748a;--line:#e5e9f1;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--navy);color:white;padding:18px max(5vw,20px) 30px}.top{max-width:1180px;margin:auto;display:flex;align-items:center;gap:18px}.logo{width:108px;height:75px;object-fit:contain;background:white;border-radius:10px;padding:5px}.brand h1{font-size:24px;letter-spacing:1.2px;margin:0 0 5px}.brand p{margin:0;color:#d8e2ff;font-size:13px;letter-spacing:2px}.hero{max-width:1180px;margin:26px auto 0}.hero h2{font-size:clamp(25px,4vw,38px);margin:0 0 9px}.hero p{margin:0;color:#d9e3ff;max-width:620px;line-height:1.5}.wrap{max-width:1180px;margin:25px auto;padding:0 20px}.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.search{flex:1;min-width:220px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;font-size:15px}.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 14px}.tab{white-space:nowrap;border:1px solid var(--line);background:white;padding:10px 15px;border-radius:30px;cursor:pointer;color:var(--navy);font-weight:700}.tab.active{background:var(--blue);color:white;border-color:var(--blue)}.count{color:var(--muted);font-size:13px;margin:3px 0 15px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.photo{height:155px;background:linear-gradient(135deg,#f1f4fa,#e6ebf5);display:flex;align-items:center;justify-content:center;color:#73809b;font-size:12px;text-align:center;padding:15px}.photo span{border:1px dashed #aab5c9;border-radius:10px;padding:18px}.info{padding:15px;display:flex;flex-direction:column;gap:8px;flex:1}.cat{font-size:10px;color:var(--blue);font-weight:800;letter-spacing:1px}.name{font-size:16px;font-weight:700;line-height:1.3}.code,.app{font-size:12px;color:var(--muted)}.price{font-size:20px;font-weight:800;color:var(--navy);margin-top:auto;padding-top:8px}.footer{margin-top:35px;padding:25px;text-align:center;background:white;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.empty{background:white;border:1px dashed var(--line);padding:35px;text-align:center;border-radius:12px;color:var(--muted)}@media(max-width:560px){.logo{width:80px;height:62px}.brand h1{font-size:17px}.hero{margin-top:22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{height:120px}.info{padding:11px}.name{font-size:14px}.price{font-size:17px}}
</style></head><body><header><div class="top"><img class="logo" src="assets/logo-wmk.png" alt="WMK"><div class="brand"><h1>WMK MOTORCYCLEPARTS</h1><p>REPUESTOS PARA TU MOTO</p></div></div><section class="hero"><h2>Encuentra el repuesto que necesitas.</h2><p>Consulta nuestro catálogo de repuestos para motocicletas. Busca por nombre, referencia o modelo.</p></section></header><main class="wrap"><div class="tools"><input id="search" class="search" placeholder="Buscar producto, código o modelo..."></div><nav class="tabs" id="tabs"></nav><div class="count" id="count"></div><section class="grid" id="grid"></section></main><footer class="footer">WMK MOTORCYCLEPARTS · Catálogo inicial en construcción</footer><script>
let products=[];let active='TODOS LOS PRODUCTOS';fetch('products.json').then(r=>r.json()).then(d=>{products=d;renderTabs();render()});const cats=['TODOS LOS PRODUCTOS','PLÁSTICOS','REPUESTOS','LLANTAS','ORIGINALES'];function renderTabs(){document.getElementById('tabs').innerHTML=cats.map(c=>`<button class="tab ${c===active?'active':''}" onclick="choose('${c}')">${c}</button>`).join('')}function choose(c){active=c;renderTabs();render()}function money(n){return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n)}function render(){let q=document.getElementById('search').value.toLowerCase();let list=products.filter(p=>(active==='TODOS LOS PRODUCTOS'||p.category===active)&&[p.name,p.code,p.application].join(' ').toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'es'));document.getElementById('count').textContent=`${list.length} productos`;document.getElementById('grid').innerHTML=list.length?list.map(p=>`<article class="card"><div class="photo"><span>Fotografía del producto<br>en preparación</span></div><div class="info"><div class="cat">${p.category}</div><div class="name">${p.name}</div><div class="code">Código: ${p.code}</div>${p.application?`<div class="app">Aplicación: ${p.application}</div>`:''}<div class="price">${money(p.price)}</div></div></article>`).join(''):'<div class="empty">No encontramos productos con esa búsqueda.</div>'}document.getElementById('search').addEventListener('input',render);
</script></body></html>
